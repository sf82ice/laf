name: Sync Upstream Release to Latest

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要拉tag历史

      - name: Get upstream latest release
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_REPO="cloudflare/cloudflared"
          LATEST_JSON=$(gh api repos/$UPSTREAM_REPO/releases/latest)
          TAG_NAME=$(echo $LATEST_JSON | jq -r .tag_name)
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          
          if [ -f .last_sync_tag ] && [ "$(cat .last_sync_tag)" = "$TAG_NAME" ]; then
            echo "Upstream tag $TAG_NAME already synced. Skip."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "$TAG_NAME" > .last_sync_tag
          
          # 下载需要的产物到 temp 目录，避免和仓库文件冲突
          mkdir -p tmp_assets
          echo $LATEST_JSON | jq -r '.assets[] | select(.name | test("linux-amd64|checksums")) | .browser_download_url' | \
          xargs -n 1 wget -P tmp_assets -q

      - name: Create latest tag if not exist
        if: steps.upstream.outputs.skip != 'true'
        run: |
          if ! git rev-parse latest >/dev/null 2>&1; then
            echo "latest tag not exist, creating..."
            git config user.name github-actions
            git config user.email github-actions@github.com
            git tag latest
            git push origin latest
          fi

      - name: Overwrite upload to latest release
        if: steps.upstream.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.upstream.outputs.tag_name }}
        run: |
          # 1. 如果latest这个release不存在就先创建，存在就直接上传
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest \
              --title "Latest" \
              --notes "Auto synced from upstream" \
              --latest=false   # 先不标记latest，等传完再说
          fi
          
          # 2. 覆盖上传，同名文件会被替换。--clobber就是关键
          gh release upload latest tmp_assets/* --clobber
          
          # 3. 更新release信息，标记为latest
          gh release edit latest \
            --title "Latest synced from upstream $TAG_NAME" \
            --notes "Auto synced from upstream tag: $TAG_NAME at $(date -u +"%Y-%m-%d %H:%M:%S UTC")" \
            --latest=true
          
          # 4. 提交同步记录
          git add .last_sync_tag
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -m "Sync upstream $TAG_NAME" || true
          git push
