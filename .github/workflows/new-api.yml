name: Sync New-API to Latest

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get upstream release and parse checksum
        id: upstream
        run: |
          UPSTREAM_REPO="QuantumNous/new-api"
          
          LATEST_JSON=$(curl -s https://api.github.com/repos/$UPSTREAM_REPO/releases | jq '.[0]')
          TAG_NAME=$(echo $LATEST_JSON | jq -r .tag_name)
          IS_PRERELEASE=$(echo $LATEST_JSON | jq -r .prerelease)
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          
          # 改成 new-api_last_sync_log
          if [ -f new-api_last_sync_log ] && [ "$(cat new-api_last_sync_log)" = "$TAG_NAME" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "$TAG_NAME" > new-api_last_sync_log
          
          mkdir -p tmp_zip tmp_extract tmp_upload
          
          CHECKSUM_LINUX_URL=$(echo $LATEST_JSON | jq -r '.assets[] | select(.name=="checksum-linux.txt") | .browser_download_url')
          CHECKSUM_WIN_URL=$(echo $LATEST_JSON | jq -r '.assets[] | select(.name=="checksum-windows.txt") | .browser_download_url')
          
          wget -q "$CHECKSUM_LINUX_URL" -O checksum-linux.txt
          wget -q "$CHECKSUM_WIN_URL" -O checksum-windows.txt
          
          grep -E 'new-api.*(amd64|arm64|aarch64)' checksum-linux.txt | awk '{print $2}' > files_to_download.txt
          grep -E 'new-api.*(amd64|arm64|aarch64)' checksum-windows.txt | awk '{print $2}' >> files_to_download.txt
          
          while read -r FILENAME; do
            if [ -z "$FILENAME" ]; then continue; fi
            URL=$(echo $LATEST_JSON | jq -r --arg NAME "$FILENAME" '.assets[] | select(.name==$NAME) | .browser_download_url')
            echo "Downloading $FILENAME"
            wget -q "$URL" -P tmp_zip/
            
            if echo "$FILENAME" | grep -q -i "windows"; then
              SYSTEM="windows"
            else
              SYSTEM="linux"
            fi
            
            if echo "$FILENAME" | grep -q -E 'arm64|aarch64'; then
              ARCH="arm64"
            else
              ARCH="amd64"
            fi
            
            unzip -q tmp_zip/"$FILENAME" -d tmp_extract/"$FILENAME"_dir
            BIN_PATH=$(find tmp_extract/"$FILENAME"_dir -type f \( -name "new-api" -o -name "new-api.exe" \) | head -n1)
            
            if [ -n "$BIN_PATH" ]; then
              if [ "$ARCH" = "arm64" ]; then
                NEW_NAME="new-api-${ARCH}-${SYSTEM}"
              else
                NEW_NAME="new-api-${SYSTEM}"
              fi
              
              if [ "$SYSTEM" = "windows" ]; then NEW_NAME="${NEW_NAME}.exe"; fi
              
              cp "$BIN_PATH" "tmp_upload/$NEW_NAME"
              echo "Created $NEW_NAME"
            fi
          done < files_to_download.txt
          
          ls -la tmp_upload/

      - name: Create latest tag if not exist
        if: steps.upstream.outputs.skip != 'true'
        run: |
          if ! git rev-parse latest >/dev/null 2>&1; then
            git config user.name github-actions
            git config user.email github-actions@github.com
            git tag latest
            git push origin latest
          fi

      - name: Overwrite upload to latest release
        if: steps.upstream.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.upstream.outputs.tag_name }}
          IS_PRERELEASE: ${{ steps.upstream.outputs.prerelease }}
        run: |
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title "Latest" --notes "Auto synced" --latest=false
          fi
          
          if [ -n "$(ls -A tmp_upload)" ]; then
            gh release upload latest tmp_upload/* --clobber
          fi
          
          NOTE="Auto synced from new-api \`$TAG_NAME\`"
          if [ "$IS_PRERELEASE" = "true" ]; then
            NOTE="$NOTE (Pre-release)"
          fi
          NOTE="$NOTE at $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          
          gh release edit latest \
            --title "Latest synced from upstream $TAG_NAME" \
            --notes "$NOTE" \
            --latest=true \
            --prerelease="$IS_PRERELEASE"
          
          # 这里也改成 new-api_last_sync_log
          git add new-api_last_sync_log
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -m "Sync new-api $TAG_NAME" || true
          git push
